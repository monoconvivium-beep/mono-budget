<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <!--
      ⚠️ NIENTE `maximum-scale=1` (tolto il 15/8/2026).
      Bloccava l'ingrandimento con due dita su Android: chi non ci vede bene
      non poteva avvicinare la scritta. Su iPhone Apple lo ignora da sempre —
      quindi non serviva a niente e faceva danno solo da una parte.
      `viewport-fit=cover` resta: serve a riempire lo schermo fino ai bordi, e
      per questo ogni schermata tiene conto di `env(safe-area-inset-*)`.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MonoConvivium — i conti, la spesa e le cose da fare</title>
    <meta
      name="description"
      content="Dì la spesa a voce e MonoConvivium la scrive, la mette in categoria e tiene i conti del mese. I dati restano sul tuo telefono."
    />
    <meta name="author" content="MONO — gastronomia, Torino" />
    <!--
      La barra di sistema in cima al telefono segue il fondo dell'app, che dal
      9/8/2026 è verde bosco. Il `background_color` del manifest invece resta
      cashmere: quello è lo sfondo dello SPLASH, cioè il seguito dell'icona.
    -->
    <meta name="theme-color" content="#3F5741" />

    <!-- Installazione sul telefono -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MonoConvivium" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- %BASE_URL% lo sostituisce la costruzione: così l'app funziona sia sul
         suo dominio, sia dentro una sottocartella (es. le pagine di GitHub). -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icona-180.png" />

    <meta property="og:title" content="MonoConvivium — i conti, la spesa e le cose da fare" />
    <meta
      property="og:description"
      content="Un tocco, una spesa: dettatura in italiano, categorie automatiche, conti del mese e dell'anno. Tutto sul telefono."
    />
    <meta property="og:type" content="website" />
    <!--
      🔗 L'IMMAGINE DEL LINK — aggiunta il 15/8/2026, e non è un vezzo.
      Il passaparola di quest'app È un link mandato su WhatsApp. Senza queste
      righe arrivava come una riga di testo grigia: un link anonimo non lo apre
      nessuno. `og:image` vuole un indirizzo INTERO (https://…): i programmi di
      messaggistica leggono la pagina da fuori e un percorso relativo non
      saprebbero a chi chiederlo.
      ⚠️ Se cambia il dominio, cambia anche qui — come in `lib/origine.ts`.
    -->
    <meta property="og:url" content="https://convivium.monobottega.it/" />
    <meta property="og:site_name" content="MONO — Bottega Gastronomica" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image" content="https://convivium.monobottega.it/anteprima.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MonoConvivium — dì la spesa a voce e i conti si fanno da soli"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://convivium.monobottega.it/anteprima.png" />

    <!--
      🔒 I caratteri sono SERVITI DA NOI, non da Google.
      Chiamare fonts.googleapis.com manderebbe l'indirizzo IP di ogni cliente a
      Google a ogni apertura, e l'app promette che non esce niente. In più:
      un carattere che arriva da fuori è una cosa che un giorno può non arrivare.
      Vedi public/font/caratteri.css.
    -->
    <!--
      I DUE CARATTERI CHE SI VEDONO PER PRIMI, chiesti subito (15/8/2026).
      Senza questo il telefono deve fare tre viaggi prima di sapere che aspetto
      hanno le lettere: pagina → caratteri.css → carattere. Su una rete lenta
      la prima schermata compare col carattere di sistema e poi cambia sotto
      gli occhi. Qui si chiedono in anticipo i due che coprono quasi tutto:
      il corpo del testo (Bricolage 400) e i titoli (Fraunces 600).
      ⚠️ Solo QUESTI DUE. Precaricare tutti i pesi vuol dire scaricare mezzo
      megabyte di roba che quasi nessuno vedrà, e rallentare proprio l'apertura
      che si voleva accelerare. `crossorigin` è obbligatorio anche se il file è
      nostro: senza, il browser lo scarica due volte.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="%BASE_URL%font/BricolageGrotesque-400-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="%BASE_URL%font/Fraunces-600-latin.woff2"
    />
    <link rel="stylesheet" href="%BASE_URL%font/caratteri.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
